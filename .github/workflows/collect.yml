name: Refresh market snapshot

on:
  schedule:
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/collect_data.py
      - name: Commit snapshot when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/latest.json
          git diff --cached --quiet || git commit -m "chore: refresh market snapshot"
          git push
